services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-travelops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-travelops-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.local/minio:/data
    restart: unless-stopped
